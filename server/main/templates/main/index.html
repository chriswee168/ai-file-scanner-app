{% load static %}

<!DOCTYPE html>
<html>
    <!-- Tab title. -->
    <title>AI Antimalware</title>

    <!-- Link to CSS. -->
    <header>
        <link rel="stylesheet" href="{% static 'main/css/index.css' %}">
    </header>

    <body>

        <h1 id="page-title">AI AntiMalware</h1>
        
        <!-- Create the list of AI models selectable from the Django AIModelsTable. -->
        <div id="model-list">
            {% for entry in model_db %}
                <div class="model-entry" id="{{entry.model_name}}">{{entry.model_name}}</div>
            {% endfor %}
        </div>

    </body>
</html>
